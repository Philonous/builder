[package]
name = "builder"
version = "0.1.0"
edition = "2024"

[lib]
name = "builder"
path = "src/lib.rs"

[[bin]]
name = "builder"
path = "src/main.rs"

[[test]]
name = "systemtests"
path = "tests/run.rs"
harness = true

[dependencies]
anyhow = "1.0.102"
ariadne = "0.6.0"
chumsky = "0.13.0"
clap = { version = "4.6.1", features = ["derive"] }
fd-lock = "4.0.4"
fs = "0.0.5"
futures = "0.3.32"
lasso = "0.7.3"
logos = "0.16.1"
parking_lot = "0.12.5"
postcard = {version = "1.1.3", features = ["use-std"]}
rapidhash = { version = "4.4.1", features = ["std"] }
regex = "1.12.3"
serde = {version = "1.0.228", features = ["derive"]}
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = {version= "0.3.23", features = ["env-filter"]}
yansi = {version = "1.0.1", features = ["detect-tty", "detect-env"]}

[dev-dependencies]
insta = { version= "1.47.2", features=["glob", "yaml"] }
tempfile = "3.27.0"


[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
